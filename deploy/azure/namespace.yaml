apiVersion: v1
kind: Namespace
metadata:
  name: buzz
  labels:
    app.kubernetes.io/part-of: buzz
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: buzz-relay
  namespace: buzz
  labels:
    app.kubernetes.io/part-of: buzz
  annotations:
    azure.workload.identity/client-id: __RELAY_IDENTITY_CLIENT_ID__
automountServiceAccountToken: true
