apiVersion: batch/v1
kind: Job
metadata:
  name: buzz-azure-storage-conformance
  namespace: buzz
  labels:
    app.kubernetes.io/part-of: buzz
    app.kubernetes.io/component: storage-conformance
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: buzz
        app.kubernetes.io/component: storage-conformance
        azure.workload.identity/use: "true"
    spec:
      restartPolicy: Never
      serviceAccountName: buzz-relay
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: conformance
          image: __CONFORMANCE_IMAGE_REPOSITORY__@__CONFORMANCE_IMAGE_DIGEST__
          imagePullPolicy: IfNotPresent
          env:
            - name: BUZZ_AZURE_TEST
              value: "1"
            - name: BUZZ_AZURE_STORAGE_ACCOUNT
              value: __STORAGE_ACCOUNT_NAME__
            - name: BUZZ_AZURE_CONFORMANCE_CONTAINER
              value: buzz-conformance
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
