apiVersion: v1
kind: ServiceAccount
metadata:
  name: buzz-kiingo-agent
  namespace: buzz
  labels:
    app.kubernetes.io/name: buzz-kiingo-agent
    app.kubernetes.io/part-of: buzz
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: buzz-agent-membership
  namespace: buzz
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: buzz
        app.kubernetes.io/component: agent-membership
    spec:
      restartPolicy: OnFailure
      serviceAccountName: buzz-kiingo-agent
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: register
          image: __RELAY_IMAGE_REPOSITORY__@__RELAY_IMAGE_DIGEST__
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              /usr/local/bin/buzz-admin add-member --pubkey "$BUZZ_AGENT_PUBLIC_KEY" --role member
              old_ifs="$IFS"
              IFS=','
              for pubkey in $BUZZ_USER_PUBKEY_ALLOWLIST; do
                case "$pubkey" in
                  *[!0-9a-fA-F]*|'') echo "invalid Buzz user public key" >&2; exit 1 ;;
                esac
                if [ "${#pubkey}" -ne 64 ]; then
                  echo "Buzz user public keys must contain exactly 64 hexadecimal characters" >&2
                  exit 1
                fi
                /usr/local/bin/buzz-admin add-member --pubkey "$pubkey" --role member
              done
              IFS="$old_ifs"
          envFrom:
            - secretRef:
                name: buzz-runtime
          env:
            - name: RELAY_URL
              value: wss://chat.kiingo.com
            - name: BUZZ_USER_PUBKEY_ALLOWLIST
              value: __BUZZ_USER_PUBKEY_ALLOWLIST__
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buzz-kiingo-agent
  namespace: buzz
  labels:
    app.kubernetes.io/name: buzz-kiingo-agent
    app.kubernetes.io/part-of: buzz
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: buzz-kiingo-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buzz-kiingo-agent
        app.kubernetes.io/part-of: buzz
    spec:
      serviceAccountName: buzz-kiingo-agent
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: __AGENT_IMAGE_REPOSITORY__@__AGENT_IMAGE_DIGEST__
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              umask 077
              bootstrap_response=/tmp/buzz-endpoint-bootstrap.json
              trap 'rm -f "${bootstrap_response}"' EXIT
              curl \
                --fail-with-body \
                --silent \
                --show-error \
                --retry 5 \
                --retry-delay 2 \
                --retry-all-errors \
                --connect-timeout 5 \
                --max-time 20 \
                --output "${bootstrap_response}" \
                --config - <<EOF
              url = "https://api.kiingo.com/api/buzz-bridge/endpoints/register"
              request = "POST"
              header = "Authorization: Bearer ${BUZZ_BRIDGE_INTERNAL_TOKEN}"
              header = "Content-Type: application/json"
              data = "{\"community_id\":\"${BUZZ_COMMUNITY_ID}\",\"agent_public_key\":\"${BUZZ_AGENT_PUBLIC_KEY}\",\"relay_url\":\"${BUZZ_CANONICAL_RELAY_URL}\",\"organization_id\":\"${BUZZ_ORGANIZATION_ID}\",\"owner_user_id\":\"${BUZZ_OWNER_USER_ID}\"}"
              EOF
              grep -q '"registered":true' "${bootstrap_response}"
              rm -f "${bootstrap_response}"
              trap - EXIT
              exec /usr/local/bin/buzz-acp
          env:
            - name: BUZZ_RELAY_URL
              value: __BUZZ_RUNTIME_RELAY_URL__
            - name: BUZZ_COMMUNITY_ID
              value: chat.kiingo.com
            - name: BUZZ_CANONICAL_RELAY_URL
              value: wss://chat.kiingo.com
            - name: BUZZ_ORGANIZATION_ID
              value: __BUZZ_ORGANIZATION_ID__
            - name: BUZZ_OWNER_USER_ID
              value: __BUZZ_OWNER_USER_ID__
            - name: BUZZ_AGENT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: buzz-runtime
                  key: BUZZ_AGENT_PUBLIC_KEY
            - name: BUZZ_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: buzz-runtime
                  key: BUZZ_PRIVATE_KEY
            - name: BUZZ_BRIDGE_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: buzz-runtime
                  key: BUZZ_BRIDGE_INTERNAL_TOKEN
            - name: KIINGO_API_BASE_URL
              value: https://api.kiingo.com
            - name: BUZZ_ACP_AGENTS
              value: "12"
            - name: BUZZ_ACP_RESPOND_TO
              value: allowlist
            - name: BUZZ_ACP_AGENT_OWNER
              valueFrom:
                secretKeyRef:
                  name: buzz-runtime
                  key: RELAY_OWNER_PUBKEY
            - name: BUZZ_ACP_RESPOND_TO_ALLOWLIST
              value: __BUZZ_USER_PUBKEY_ALLOWLIST__
            - name: BUZZ_ACP_ALLOWED_RESPOND_TO
              value: owner-only,allowlist
            - name: BUZZ_ACP_KIINGO_PUBLICATION_ENABLED
              value: "true"
            - name: KIINGO_ACP_POLL_INTERVAL_MS
              value: "100"
            - name: BUZZ_ACP_CONTEXT_MESSAGE_LIMIT
              value: "20"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "kill -0 1"]
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "kill -0 1"]
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: buzz-kiingo-agent
  namespace: buzz
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: buzz-kiingo-agent
  policyTypes: [Ingress]
  ingress: []
