apiVersion: batch/v1
kind: Job
metadata:
  name: buzz-azure-storage-recovery
  namespace: buzz
  labels:
    app.kubernetes.io/part-of: buzz
    app.kubernetes.io/component: storage-recovery
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: buzz
        app.kubernetes.io/component: storage-recovery
        azure.workload.identity/use: "true"
    spec:
      restartPolicy: Never
      serviceAccountName: buzz-relay
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: recovery
          image: mcr.microsoft.com/azure-cli@__AZURE_CLI_IMAGE_DIGEST__
          imagePullPolicy: IfNotPresent
          env:
            - name: AZURE_CONFIG_DIR
              value: /tmp/.azure
            - name: AZURE_SUBSCRIPTION_ID
              value: __AZURE_SUBSCRIPTION_ID__
            - name: STORAGE_ACCOUNT_NAME
              value: __STORAGE_ACCOUNT_NAME__
            - name: STORAGE_CONTAINER_NAME
              value: buzz-conformance
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              az login \
                --service-principal \
                --username "${AZURE_CLIENT_ID}" \
                --tenant "${AZURE_TENANT_ID}" \
                --federated-token "$(cat "${AZURE_FEDERATED_TOKEN_FILE}")" \
                --allow-no-subscriptions \
                --output none
              az account set --subscription "${AZURE_SUBSCRIPTION_ID}"

              blob="recovery/${HOSTNAME}.txt"
              printf 'version-one' >/tmp/version-one.txt
              printf 'version-two' >/tmp/version-two.txt

              az storage blob upload \
                --account-name "${STORAGE_ACCOUNT_NAME}" \
                --container-name "${STORAGE_CONTAINER_NAME}" \
                --name "${blob}" \
                --file /tmp/version-one.txt \
                --content-type text/plain \
                --overwrite true \
                --auth-mode login \
                --output none
              version_one="$(az storage blob list \
                --account-name "${STORAGE_ACCOUNT_NAME}" \
                --container-name "${STORAGE_CONTAINER_NAME}" \
                --prefix "${blob}" \
                --include v \
                --auth-mode login \
                --query "[?name=='${blob}'] | sort_by(@, &properties.lastModified)[-1].versionId" \
                --output tsv)"
              test -n "${version_one}"

              az storage blob upload \
                --account-name "${STORAGE_ACCOUNT_NAME}" \
                --container-name "${STORAGE_CONTAINER_NAME}" \
                --name "${blob}" \
                --file /tmp/version-two.txt \
                --content-type text/plain \
                --overwrite true \
                --auth-mode login \
                --output none
              az storage blob download \
                --account-name "${STORAGE_ACCOUNT_NAME}" \
                --container-name "${STORAGE_CONTAINER_NAME}" \
                --name "${blob}" \
                --version-id "${version_one}" \
                --file /tmp/restored-version.txt \
                --overwrite \
                --auth-mode login \
                --output none
              test "$(cat /tmp/version-one.txt)" = "$(cat /tmp/restored-version.txt)"

              az storage blob upload \
                --account-name "${STORAGE_ACCOUNT_NAME}" \
                --container-name "${STORAGE_CONTAINER_NAME}" \
                --name "${blob}" \
                --file /tmp/restored-version.txt \
                --content-type text/plain \
                --overwrite true \
                --auth-mode login \
                --output none
              az storage blob download \
                --account-name "${STORAGE_ACCOUNT_NAME}" \
                --container-name "${STORAGE_CONTAINER_NAME}" \
                --name "${blob}" \
                --file /tmp/current-after-version-restore.txt \
                --overwrite \
                --auth-mode login \
                --output none
              test "$(cat /tmp/version-one.txt)" = "$(cat /tmp/current-after-version-restore.txt)"

              az storage blob delete \
                --account-name "${STORAGE_ACCOUNT_NAME}" \
                --container-name "${STORAGE_CONTAINER_NAME}" \
                --name "${blob}" \
                --auth-mode login \
                --output none
              test "$(az storage blob exists \
                --account-name "${STORAGE_ACCOUNT_NAME}" \
                --container-name "${STORAGE_CONTAINER_NAME}" \
                --name "${blob}" \
                --auth-mode login \
                --query exists \
                --output tsv)" = "false"

              az storage blob download \
                --account-name "${STORAGE_ACCOUNT_NAME}" \
                --container-name "${STORAGE_CONTAINER_NAME}" \
                --name "${blob}" \
                --version-id "${version_one}" \
                --file /tmp/restored-after-delete.txt \
                --overwrite \
                --auth-mode login \
                --output none
              az storage blob upload \
                --account-name "${STORAGE_ACCOUNT_NAME}" \
                --container-name "${STORAGE_CONTAINER_NAME}" \
                --name "${blob}" \
                --file /tmp/restored-after-delete.txt \
                --content-type text/plain \
                --overwrite true \
                --auth-mode login \
                --output none
              az storage blob download \
                --account-name "${STORAGE_ACCOUNT_NAME}" \
                --container-name "${STORAGE_CONTAINER_NAME}" \
                --name "${blob}" \
                --file /tmp/current-after-delete-recovery.txt \
                --overwrite \
                --auth-mode login \
                --output none
              test "$(cat /tmp/version-one.txt)" = "$(cat /tmp/current-after-delete-recovery.txt)"
              echo "Azure Blob version restore and deletion recovery passed for ${blob}."
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
