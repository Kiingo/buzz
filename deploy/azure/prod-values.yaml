replicaCount: 2
image:
  repository: __RELAY_IMAGE_REPOSITORY__
  tag: unused
  digest: __RELAY_IMAGE_DIGEST__
  pullPolicy: IfNotPresent
relayUrl: wss://chat.kiingo.com
mediaBaseUrl: https://chat.kiingo.com/media
ownerPubkey: __RELAY_OWNER_PUBKEY__
secrets:
  existingSecret: buzz-runtime
relay:
  requireAuthToken: true
  requireRelayMembership: true
  requireMediaGetAuth: true
  allowNipOaAuth: true
  pubkeyAllowlist: false
  huddleAudioAvailable: false
  # Keep the image's default BUZZ_WEB_DIR so the public `/invite/{code}`
  # support page can hand off to the signed desktop client. The Git/browser
  # routes remain disabled, so this does not expose a hosted chat client.
  extraEnv:
    - name: BUZZ_SERVE_GIT_WEB_GUI
      value: "false"
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      # Leave enough requested CPU for one relay replica on each of the two
      # launch nodes after AKS system add-ons reserve their capacity. The
      # one-core limit still permits short relay bursts.
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  topologySpreadConstraints:
    - maxSkew: 1
      # Fail visibly with one available replica if fewer than two schedulable
      # node domains exist instead of silently co-locating both relay replicas.
      minDomains: 2
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: buzz
          app.kubernetes.io/instance: buzz
          app.kubernetes.io/component: relay
  extraVolumeMounts:
    - name: buzz-key-vault
      mountPath: /mnt/secrets-store
      readOnly: true
extraVolumes:
  - name: buzz-key-vault
    csi:
      driver: secrets-store.csi.k8s.io
      readOnly: true
      volumeAttributes:
        secretProviderClass: buzz-runtime
serviceAccount:
  create: false
  name: buzz-relay
podDisruptionBudget:
  enabled: true
  minAvailable: 1
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # Match the relay's 500 MiB video ceiling while leaving a small amount of
    # headroom for the raw request body. Stream uploads instead of buffering
    # them on the ingress controller's limited ephemeral disk.
    nginx.ingress.kubernetes.io/proxy-body-size: "512m"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    # Preview and production edge hostnames are aliases for one canonical Buzz
    # community. Preserve row-zero tenant binding by normalizing the upstream
    # Host before the relay reads it.
    nginx.ingress.kubernetes.io/upstream-vhost: "chat.kiingo.com"
    nginx.ingress.kubernetes.io/enable-modsecurity: "true"
    nginx.ingress.kubernetes.io/modsecurity-snippet: |
      SecRuleEngine On
      SecRule &REQUEST_HEADERS:X-Azure-FDID "@eq 0" "id:106,phase:1,deny,status:403,log"
      SecRule REQUEST_HEADERS:X-Azure-FDID "!@streq __FRONT_DOOR_ID__" "id:107,phase:1,deny,status:403,log"
      SecRule REQUEST_HEADERS:X-Buzz-Origin-Verify "!@streq __ORIGIN_VERIFICATION_SECRET__" "id:108,phase:1,deny,status:403,log"
  hosts:
    - host: chat.kiingo.com
      paths:
        - path: /
          pathType: Prefix
    # Front Door establishes TLS to the dedicated origin hostname. A matching
    # ingress rule is required so nginx loads buzz-origin-tls instead of
    # presenting its default self-signed certificate for that SNI name.
    - host: buzz-origin.kiingo.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - buzz-origin.kiingo.com
      secretName: buzz-origin-tls
persistence:
  git:
    enabled: false
    size: 4Gi
postgresql:
  enabled: false
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: true
    existingSecret: buzz-runtime
    existingSecretPasswordKey: redis-password
  persistence:
    enabled: false
  networkPolicy:
    enabled: true
    allowExternal: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
objectStorage:
  backend: azure
  azure:
    account: __STORAGE_ACCOUNT_NAME__
    workloadIdentityClientId: __RELAY_IDENTITY_CLIENT_ID__
    mediaContainer: buzz-media
    gitContainer: buzz-git
minio:
  enabled: false
migrate:
  autoMigrate: false
serviceMonitor:
  enabled: false
