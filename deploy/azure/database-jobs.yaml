apiVersion: batch/v1
kind: Job
metadata:
  name: buzz-database-bootstrap
  namespace: buzz
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: buzz
        app.kubernetes.io/component: database-bootstrap
        azure.workload.identity/use: "true"
    spec:
      restartPolicy: Never
      serviceAccountName: buzz-relay
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: __RELAY_IMAGE_REPOSITORY__@__RELAY_IMAGE_DIGEST__
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              export PGPASSWORD="$(cat /mnt/secrets-store/buzz-postgres-admin-password)"
              app_password="$(cat /mnt/secrets-store/buzz-database-password)"
              postgres_host="$(cat /mnt/secrets-store/buzz-postgres-host)"
              psql "host=$postgres_host port=5432 dbname=buzz user=buzzadmin sslmode=require" \
                --set=ON_ERROR_STOP=1 --set=app_password="$app_password" <<'SQL'
              SELECT 'CREATE ROLE buzz_app LOGIN'
              WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'buzz_app') \gexec
              SELECT format('ALTER ROLE buzz_app LOGIN PASSWORD %L', :'app_password') \gexec
              ALTER DATABASE buzz OWNER TO buzz_app;
              ALTER SCHEMA public OWNER TO buzz_app;
              GRANT ALL ON SCHEMA public TO buzz_app;
              SQL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: secrets
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: buzz-runtime
---
apiVersion: batch/v1
kind: Job
metadata:
  name: buzz-database-migrate
  namespace: buzz
spec:
  # Applying both manifests must not race the app-role bootstrap. The deploy
  # script unsuspends this job only after bootstrap completes successfully.
  suspend: true
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: buzz
        app.kubernetes.io/component: database-migrate
    spec:
      restartPolicy: Never
      serviceAccountName: buzz-relay
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: __RELAY_IMAGE_REPOSITORY__@__RELAY_IMAGE_DIGEST__
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/buzz-admin", "migrate"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: buzz-runtime
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
