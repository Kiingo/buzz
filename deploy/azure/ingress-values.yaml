controller:
  replicaCount: 2
  allowSnippetAnnotations: true
  config:
    # This is a dedicated Buzz cluster: only the release pipeline can create
    # Ingress objects. The origin-verification rules below use the upstream
    # ModSecurity snippet annotation, which ingress-nginx classifies Critical.
    annotations-risk-level: "Critical"
    enable-modsecurity: "true"
    use-forwarded-headers: "true"
    proxy-real-ip-cidr: "147.243.0.0/16"
  service:
    externalTrafficPolicy: Local
    annotations:
      service.beta.kubernetes.io/azure-load-balancer-resource-group: rg-buzz-prod
      service.beta.kubernetes.io/azure-pip-name: pip-buzz-origin-prod
      service.beta.kubernetes.io/azure-allowed-service-tags: AzureFrontDoor.Backend
      service.beta.kubernetes.io/azure-load-balancer-tcp-idle-timeout: "30"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  admissionWebhooks:
    patch:
      image:
        digest: sha256:01038e7de14b78d702d2849c3aad72fd25903c4765af63cf16aa3398f5d5f2dd
  image:
    digest: sha256:594ceea76b01c592858f803f9ff4d2cb40542cae2060410b2c95f75907d659e1
defaultBackend:
  enabled: false
