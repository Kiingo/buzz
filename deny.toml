[advisories]
ignore = [
    # instant 0.1.13 — unmaintained crate. Transitive dep: nostr → instant.
    # Will be resolved when nostr crate updates its dependencies.
    { id = "RUSTSEC-2024-0384", reason = "transitive dep via nostr; no upstream fix available" },
    # paste 1.0.15 — unmaintained. Transitive dep: mesh-llm → iroh → netlink-* → paste.
    # No safe upgrade available; tracked for upstream (iroh/netlink) replacement.
    { id = "RUSTSEC-2024-0436", reason = "transitive dep via mesh-llm → iroh → netlink; no upstream fix available" },
    # unsafe-libyaml 0.2.11 — unmaintained (not a vulnerability). Pulled in by the
    # deprecated serde_yaml, used by buzz-agent, buzz-persona, buzz-relay,
    # buzz-workflow and kube-client. Remove once those move to a maintained YAML
    # crate (serde_yaml's successors) and kube-client follows.
    { id = "RUSTSEC-2024-0449", reason = "transitive via deprecated serde_yaml (first-party crates + kube-client); unmaintained notice, no vulnerability; migration tracked" },
    # quick-xml < 0.41: quadratic runtime on duplicate-attribute check (0194) and
    # unbounded namespace-declaration allocation in NsReader (0195). Both DoS-class,
    # requiring attacker-controlled XML. Our two locked versions only parse trusted
    # input: 0.38.4 (rust-s3/aws-creds — responses from our own S3/MinIO endpoint)
    # and 0.39.4 (mesh-llm → iroh → netdev → plist — local macOS system plists).
    # Patched release (>= 0.41.0) is unreachable until rust-s3 and plist/netdev bump;
    # remove these when upstream catches up.
    { id = "RUSTSEC-2026-0194", reason = "transitive via rust-s3 and mesh-llm→plist; trusted-input XML only; no upstream fix available yet" },
    { id = "RUSTSEC-2026-0195", reason = "transitive via rust-s3 and mesh-llm→plist; trusted-input XML only; no upstream fix available yet" },
    # unsafe-libyaml 0.2.11 — unmaintained (repository archived 2024-03-25), not a
    # vulnerability report. Transitive dep: serde_yaml → unsafe-libyaml. The serde_yaml_ng
    # fork uses the same crate, so removing it means migrating YAML parsing in
    # buzz-agent, buzz-persona, buzz-relay, buzz-workflow and desktop.
    { id = "RUSTSEC-2024-0449", reason = "transitive via serde_yaml; unmaintained, not vulnerable; removal needs a YAML parser migration" },
    # NetEQ =0.8.3 declares ringbuf but its published Rust sources never use it,
    # so Consumer::skip/clear and their panic-unsafe Drop path are unreachable.
    # NetEQ 0.9.1 still declares ringbuf 0.3; ringbuf itself is fixed in 0.5.2.
    # Keep the exact NetEQ pin and the wrapper ban below together. Re-audit or
    # remove this exception when NetEQ removes/updates the unused dependency.
    { id = "RUSTSEC-2026-0293", reason = "unused dependency of audited, exactly pinned neteq 0.8.3; no Rust references to ringbuf; other consumers forbidden by bans.deny" },
    # zip < 9: SUID/SGID bits kept by extraction (0367), extract() following
    # attacker symlinks (0368) and applying permissions through symlinks (0369).
    # zip 8.6.0 is pulled only by mesh-llm v0.76.2 (plugin-manager, system,
    # host-runtime), which never calls ZipArchive::extract or
    # ZipStreamReader::extract: it walks entries itself, rejects paths without
    # an enclosed_name, and writes plain files with File::create, so no mode bits
    # or symlinks are materialized. A fixed zip needs a mesh-llm release on
    # zip >= 9; remove these when buzz-relay moves to it.
    { id = "RUSTSEC-2026-0367", reason = "zip 8.6.0 via mesh-llm v0.76.2 only; extract() is never called (entries written as plain files); needs mesh-llm on zip >= 9" },
    { id = "RUSTSEC-2026-0368", reason = "zip 8.6.0 via mesh-llm v0.76.2 only; extract() is never called and no symlinks are created; needs mesh-llm on zip >= 9" },
    { id = "RUSTSEC-2026-0369", reason = "zip 8.6.0 via mesh-llm v0.76.2 only; extract() is never called and no permissions are applied; needs mesh-llm on zip >= 9" },
    # zvariant, zbus_names and zvariant_derive 5.x/4.x: unmaintained notices
    # (merged into zbus 6), not vulnerabilities. Pulled only by zbus 5.19 via
    # secret-service / zbus-secret-service-keyring-store (desktop Linux
    # keyring). No compatible upgrade until keyring moves to zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained (merged into zbus 6); transitive via zbus 5.19 for the Linux keyring; no compatible upgrade yet" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained (merged into zbus 6); transitive via zbus 5.19 for the Linux keyring; no compatible upgrade yet" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained (merged into zbus 6); transitive via zbus 5.19 for the Linux keyring; no compatible upgrade yet" },
    # crypto-bigint 0.5.5: operations meant to be constant-time can branch on
    # their inputs (timing side channel on secret integers). Pulled only by
    # p256 0.13 (elliptic-curve 0.13) in buzz-push-gateway, whose shipped code
    # uses it for App Attest public-key parsing and signature verification:
    # public inputs only, no secret scalars (signing is test-only, behind
    # #[cfg(test)]). If any non-test code adds SigningKey/SecretKey/ECDH on
    # p256, this ignore is no longer valid. The fix is crypto-bigint >= 0.7.6
    # via p256/elliptic-curve 0.14; that bump removes this ignore in the same
    # change. Review by 2026-11-07.
    { id = "RUSTSEC-2026-0387", reason = "public-key verification only (App Attest); no secret scalars; crypto-bigint 0.5.5 via p256 0.13 in buzz-push-gateway; review by 2026-11-07" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "OpenSSL",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MITNFA",
    "MPL-2.0",
    "BSL-1.0",
    "Unlicense",
    # minicbor's permissive, OSI-approved license. Used for strict App Attest
    # assertion CBOR parsing and also transitively by appattest.
    "BlueOak-1.0.0",
    # bzip2/libbzip2's permissive BSD-like license. New via desktop zip/bzip2
    # transitive deps; compatible with Apache-2.0 distribution.
    "bzip2-1.0.6",
]
confidence-threshold = 0.8

# mesh-llm workspace crates (pinned git dep) omit a per-crate `license` field in
# their manifests, so cargo-deny reports them as unlicensed. The mesh-llm repo is
# licensed "MIT OR Apache-2.0" (workspace Cargo.toml + top-level LICENSE = Apache-2.0);
# clarify each pulled-in member to that expression. Remove once mesh sets the field
# upstream (filed).
[[licenses.clarify]]
crate = "mesh-llm-config"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "mesh-llm-gpu-bench"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "mesh-llm-host-runtime"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "mesh-llm-plugin"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "mesh-llm-system"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "mesh-mixture-of-agents"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "buzz-desktop"
expression = "Apache-2.0"
license-files = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = [
    { name = "ringbuf", version = "<0.5.2", wrappers = ["neteq"], reason = "only audited NetEQ may declare this unused vulnerable dependency; all other consumers must use a patched release" },
]
