name: Windows Canary

# Produces an unsigned Windows NSIS installer from main without creating
# a tag, GitHub Release, or auto-updater artifact. The installer is available
# only as a short-lived GitHub Actions artifact for explicit testing.
# Kiingo/buzz may invoke the same non-secret workflow from a review branch,
# but the packaged source must be an exact revision already merged into main.
#
# Design notes vs. signed-macos-canary.yml:
#   - No mesh-llm: release-windows doesn't build it.
#   - pnpm store restore/save pattern mirrors ci.yml:149-196.
on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact merged Kiingo/buzz commit for an internal pilot build (unused by block/buzz)
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build Windows canary
    if: github.repository == 'block/buzz' || github.repository == 'Kiingo/buzz'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.repository == 'Kiingo/buzz' && inputs.source_revision || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require trusted source revision
        id: source
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          set -euo pipefail
          if [[ "$REPOSITORY" == "block/buzz" ]]; then
            if [[ "$SOURCE_REF" != "refs/heads/main" ]]; then
              echo "::error::Upstream canary builds must run from main; got $SOURCE_REF"
              exit 1
            fi
            SOURCE_REVISION=$(git rev-parse HEAD)
          else
            if ! [[ "$SOURCE_REVISION" =~ ^[a-f0-9]{40}$ ]]; then
              echo "::error::Kiingo source_revision must be an exact lowercase 40-character commit"
              exit 1
            fi
            if [[ "$(git rev-parse HEAD)" != "$SOURCE_REVISION" ]]; then
              echo "::error::Checked-out revision does not match source_revision"
              exit 1
            fi
            git fetch origin main --depth=200
            if ! git merge-base --is-ancestor "$SOURCE_REVISION" origin/main; then
              echo "::error::Kiingo source_revision is not merged into main"
              exit 1
            fi
          fi
          echo "source_revision=$SOURCE_REVISION" >> "$GITHUB_OUTPUT"

      # The Windows runner ships with rustup preinstalled; rust-toolchain.toml
      # in the repo root pins the channel (1.95.0) automatically. We only need
      # to ensure the cross-compile target is registered; on windows-latest the
      # host IS x86_64-pc-windows-msvc so this is typically a no-op.
      - name: Add Rust target
        shell: bash
        run: rustup target add "$TARGET"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1
          package-manager-cache: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.4.0

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install desktop dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Derive canary version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          BASE_VERSION=$(node -p "require('./desktop/package.json').version")
          if ! [[ "$BASE_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Desktop version '$BASE_VERSION' is not semver"
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))-test.${GITHUB_RUN_NUMBER}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building canary version $VERSION from ${{ steps.source.outputs.source_revision }}"

      - name: Patch canary version
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd desktop && node scripts/set-version-from-tag.mjs "$VERSION"
          cd src-tauri && cargo update --workspace

      - name: Resolve native toolchain identity
        id: native_toolchain
        shell: bash
        run: echo "id=$(scripts/desktop-native-toolchain-id.sh windows)" >> "$GITHUB_OUTPUT"

      # Compute this after cargo update so the key describes the graph that is
      # actually compiled. The helper normalizes only Buzz Desktop's release
      # version, allowing a canary to warm an otherwise identical tag build.
      - name: Compute exact release cache key
        id: rust_cache_key
        shell: bash
        env:
          NATIVE_TOOLCHAIN_ID: ${{ steps.native_toolchain.outputs.id }}
        run: |
          KEY=$(scripts/desktop-release-cache-key.py \
            --platform "$RUNNER_OS" \
            --target x86_64-pc-windows-msvc \
            --features default \
            --native-inputs "$NATIVE_TOOLCHAIN_ID")
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "Release cache key: $KEY"

      - name: Restore exact release Cargo cache
        id: rust_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            desktop/src-tauri/target
            !desktop/src-tauri/target/**/release/bundle
          key: ${{ steps.rust_cache_key.outputs.key }}

      - name: Generate non-updating bundle config
        shell: bash
        run: |
          cat > desktop/src-tauri/tauri.canary.conf.json <<'JSON'
          {
            "bundle": {
              "createUpdaterArtifacts": false
            }
          }
          JSON

      - name: Build sidecars
        shell: bash
        run: |
          cargo build --release --target "$TARGET" -p buzz-acp -p buzz-agent -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          ./scripts/bundle-sidecars.sh "$TARGET"

      - name: Prohibit provider credentials in Kiingo pilot build
        if: github.repository == 'Kiingo/buzz'
        shell: bash
        run: |
          set -euo pipefail
          forbidden=(
            OPENAI_API_KEY ANTHROPIC_API_KEY CODEX_HOME CODEX_API_KEY
            CODEX_CHATGPT_AUTH_JSON BUZZ_BUILD_AGENT_ENV
          )
          for name in "${forbidden[@]}"; do
            if [[ -n "${!name:-}" ]]; then
              echo "::error::Provider credential environment is forbidden in a Kiingo pilot build: ${name}"
              exit 1
            fi
          done

      - name: Build Windows NSIS installer (unsigned)
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          set -euo pipefail
          if [[ "$REPOSITORY" == "Kiingo/buzz" ]]; then
            export BUZZ_RELAY_URL='wss://chat.kiingo.com'
            export BUZZ_CANONICAL_RELAY_URL='wss://chat.kiingo.com'
            export BUZZ_RELAY_HTTP='https://chat.kiingo.com'
            export BUZZ_BUILD_AUTO_CONNECT_DEFAULT_RELAY='1'
            export BUZZ_BUILD_CODEX_ENROLLMENT_URL='https://app.kiingo.com/team/harness-connections?provider=codex&buzz=connect'
          fi
          cd desktop
          pnpm tauri build --target "$TARGET" --bundles nsis --config src-tauri/tauri.canary.conf.json

      - name: Locate NSIS installer
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_DIR="desktop/src-tauri/target/${TARGET}/release/bundle"
          EXE=$(find "$BUNDLE_DIR/nsis" -name '*.exe' -type f | head -1)
          if [[ -z "$EXE" ]]; then
            echo "::error::No NSIS installer found in $BUNDLE_DIR/nsis"
            exit 1
          fi
          echo "exe=$EXE" >> "$GITHUB_OUTPUT"

      - name: Verify unsigned Kiingo pilot contract
        if: github.repository == 'Kiingo/buzz'
        shell: pwsh
        run: |
          $bundle = "desktop/src-tauri/target/$env:TARGET/release/bundle"
          $installer = Get-Item '${{ steps.artifact.outputs.exe }}'
          $app = Get-Item "desktop/src-tauri/target/$env:TARGET/release/buzz-desktop.exe"
          foreach ($file in @($installer, $app)) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne 'NotSigned') {
              throw "Expected an unsigned pilot artifact: $($file.FullName) ($($signature.Status))"
            }
          }
          rg -a -q 'wss://chat\.kiingo\.com' $app.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Kiingo relay URL is absent from the pilot executable.' }
          rg -a -q 'https://app\.kiingo\.com/team/harness-connections\?provider=codex&buzz=connect' $app.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Codex enrollment URL is absent from the pilot executable.' }
          rg -a -q 'kiingo-desktop-latest' $app.FullName
          if ($LASTEXITCODE -eq 0) { throw 'Signed production updater endpoint must be absent from the pilot executable.' }
          $global:LASTEXITCODE = 0

      - name: Upload Windows canary installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ github.repository == 'Kiingo/buzz' && 'kiingo-buzz-windows-pilot' || 'buzz-windows-canary' }}-${{ steps.source.outputs.source_revision }}
          path: ${{ steps.artifact.outputs.exe }}
          if-no-files-found: error
          retention-days: 7

      - name: Measure release Cargo cache inputs
        if: always()
        shell: bash
        run: du -sh ~/.cargo/registry ~/.cargo/git target desktop/src-tauri/target 2>/dev/null || true

      # Only the upstream main-bound canary writes the cache. The Kiingo pilot
      # may run from a review branch, so it consumes but never populates caches.
      # Excluding bundle output prevents installers from entering the cache.
      - name: Save exact release Cargo cache
        if: github.repository == 'block/buzz' && steps.rust_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            desktop/src-tauri/target
            !desktop/src-tauri/target/**/release/bundle
          key: ${{ steps.rust_cache_key.outputs.key }}

      - name: Save pnpm store cache
        if: github.repository == 'block/buzz'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
