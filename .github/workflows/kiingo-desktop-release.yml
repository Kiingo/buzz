name: Kiingo desktop release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver for the Kiingo desktop package (for example 0.5.1-kiingo.1)
        required: true
        type: string
      source_revision:
        description: Exact merged 40-character Kiingo/buzz commit to release
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: kiingo-desktop-production-release
  cancel-in-progress: false

env:
  BUZZ_RELAY_URL: wss://chat.kiingo.com
  BUZZ_CANONICAL_RELAY_URL: wss://chat.kiingo.com
  BUZZ_RELAY_HTTP: https://chat.kiingo.com
  BUZZ_BUILD_AUTO_CONNECT_DEFAULT_RELAY: '1'
  BUZZ_BUILD_CODEX_ENROLLMENT_URL: https://app.kiingo.com/team/harness-connections?provider=codex&buzz=connect
  BUZZ_UPDATER_ENDPOINT: https://github.com/Kiingo/buzz/releases/download/kiingo-desktop-latest/latest.json

jobs:
  validate:
    name: Validate immutable release input
    if: github.repository == 'Kiingo/buzz'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_revision: ${{ steps.source.outputs.source_revision }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: source
        name: Require a merged exact source revision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" == 'main' ]] || {
            echo '::error::Kiingo production desktop releases run only from main.'
            exit 1
          }
          [[ "${SOURCE_REVISION}" =~ ^[a-f0-9]{40}$ ]] || {
            echo '::error::source_revision must be an exact lowercase 40-character commit.'
            exit 1
          }
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo '::error::version must be valid semver.'
            exit 1
          }
          git fetch origin main --depth=100
          git cat-file -e "${SOURCE_REVISION}^{commit}"
          git merge-base --is-ancestor "${SOURCE_REVISION}" origin/main || {
            echo '::error::source_revision is not merged into Kiingo/buzz main.'
            exit 1
          }
          if gh release view "kiingo-desktop-v${VERSION}" >/dev/null 2>&1; then
            echo '::error::This immutable Kiingo desktop version already exists.'
            exit 1
          fi
          echo "source_revision=${SOURCE_REVISION}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

  macos:
    name: Signed macOS (${{ matrix.platform }})
    needs: validate
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-aarch64
            target: aarch64-apple-darwin
          - platform: darwin-x86_64
            target: x86_64-apple-darwin
    runs-on: macos-14
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      TARGET: ${{ matrix.target }}
      BUZZ_UPDATER_PUBLIC_KEY: ${{ secrets.KIINGO_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.KIINGO_TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.KIINGO_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.KIINGO_APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.KIINGO_APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.KIINGO_APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.KIINGO_APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.KIINGO_APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.KIINGO_APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.validate.outputs.source_revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require signing and updater identities
        shell: bash
        run: |
          set -euo pipefail
          required=(
            BUZZ_UPDATER_PUBLIC_KEY TAURI_SIGNING_PRIVATE_KEY
            APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY
            APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          )
          for name in "${required[@]}"; do
            [[ -n "${!name:-}" ]] || {
              echo "::error::Missing protected Kiingo desktop release secret: ${name}"
              exit 1
            }
          done

      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - name: Install desktop dependencies
        run: just desktop-install-ci

      - name: Configure immutable Kiingo release
        shell: bash
        run: |
          set -euo pipefail
          rustup target add "${TARGET}"
          cd desktop
          node scripts/set-version-from-tag.mjs "${VERSION}"
          node scripts/build-release-config.mjs

      - name: Prohibit provider credentials in the package build
        shell: bash
        run: |
          set -euo pipefail
          forbidden=(OPENAI_API_KEY ANTHROPIC_API_KEY CODEX_HOME CODEX_API_KEY CODEX_CHATGPT_AUTH_JSON)
          for name in "${forbidden[@]}"; do
            [[ -z "${!name:-}" ]] || {
              echo "::error::Provider credential environment is forbidden in a Kiingo Buzz desktop build: ${name}"
              exit 1
            }
          done
          [[ -z "${BUZZ_BUILD_AGENT_ENV:-}" ]] || {
            echo '::error::BUZZ_BUILD_AGENT_ENV must be empty for the Kiingo desktop package.'
            exit 1
          }

      - name: Build sidecars
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --target "${TARGET}" -p buzz-acp -p buzz-agent -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          ./scripts/bundle-sidecars.sh "${TARGET}"

      - name: Build, sign, notarize, and staple
        shell: bash
        run: cd desktop && pnpm tauri build --verbose --target "${TARGET}" --config src-tauri/tauri.release.conf.json

      - name: Verify package identity and embedded Kiingo contract
        shell: bash
        run: |
          set -euo pipefail
          bundle="desktop/src-tauri/target/${TARGET}/release/bundle"
          app="${bundle}/macos/Buzz.app"
          dmg="$(find "${bundle}/dmg" -name '*.dmg' -type f | head -1)"
          [[ -d "${app}" && -f "${dmg}" ]]
          codesign --verify --deep --strict --verbose=2 "${app}"
          spctl --assess --type execute --verbose=4 "${app}"
          xcrun stapler validate "${dmg}"
          binary="${app}/Contents/MacOS/Buzz"
          rg -a -q 'wss://chat\.kiingo\.com' "${binary}"
          rg -a -q 'https://app\.kiingo\.com/team/harness-connections\?provider=codex&buzz=connect' "${binary}"

      - name: Stage signed release evidence
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          bundle="desktop/src-tauri/target/${TARGET}/release/bundle"
          dmg="$(find "${bundle}/dmg" -name '*.dmg' -type f | head -1)"
          archive="$(find "${bundle}/macos" -name '*.tar.gz' -type f | head -1)"
          [[ -n "${dmg}" && -n "${archive}" && -f "${archive}.sig" ]]
          mkdir -p staging
          installer_name="Kiingo-Buzz_${VERSION}_${PLATFORM}.dmg"
          archive_name="Kiingo-Buzz_${VERSION}_${PLATFORM}.app.tar.gz"
          cp "${dmg}" "staging/${installer_name}"
          cp "${archive}" "staging/${archive_name}"
          cp "${archive}.sig" "staging/${PLATFORM}.sig"
          jq -n \
            --arg platform "${PLATFORM}" \
            --arg installer "${installer_name}" \
            --arg archive "${archive_name}" \
            '{platform:$platform,installer:$installer,archive:$archive,signature_file:($platform + ".sig")}' \
            > staging/metadata.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kiingo-desktop-${{ matrix.platform }}
          path: staging
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Signed Windows
    needs: validate
    environment: production
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      TARGET: x86_64-pc-windows-msvc
      BUZZ_UPDATER_PUBLIC_KEY: ${{ secrets.KIINGO_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.KIINGO_TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.KIINGO_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      ARTIFACT_SIGNING_ENDPOINT: ${{ vars.KIINGO_ARTIFACT_SIGNING_ENDPOINT }}
      ARTIFACT_SIGNING_ACCOUNT: ${{ vars.KIINGO_ARTIFACT_SIGNING_ACCOUNT }}
      ARTIFACT_SIGNING_PROFILE: ${{ vars.KIINGO_ARTIFACT_SIGNING_PROFILE }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.validate.outputs.source_revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require signing and updater identities
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          required=(
            BUZZ_UPDATER_PUBLIC_KEY TAURI_SIGNING_PRIVATE_KEY
            AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID
            ARTIFACT_SIGNING_ENDPOINT ARTIFACT_SIGNING_ACCOUNT ARTIFACT_SIGNING_PROFILE
          )
          for name in "${required[@]}"; do
            [[ -n "${!name:-}" ]] || {
              echo "::error::Missing protected Kiingo desktop release setting: ${name}"
              exit 1
            }
          done

      - uses: azure/login@1384c340ab2dda50fed2bee3041d1d87018aa5e8 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ env.TARGET }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1
          package-manager-cache: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.4.0

      - name: Install desktop and signing dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          cargo install artifact-signing-cli --locked

      - name: Configure immutable Kiingo release
        shell: bash
        run: |
          set -euo pipefail
          export BUZZ_WINDOWS_SIGN_COMMAND="artifact-signing-cli -e ${ARTIFACT_SIGNING_ENDPOINT} -a ${ARTIFACT_SIGNING_ACCOUNT} -c ${ARTIFACT_SIGNING_PROFILE} -d Kiingo-Buzz %1"
          cd desktop
          node scripts/set-version-from-tag.mjs "${VERSION}"
          node scripts/build-release-config.mjs

      - name: Prohibit provider credentials in the package build
        shell: bash
        run: |
          set -euo pipefail
          forbidden=(OPENAI_API_KEY ANTHROPIC_API_KEY CODEX_HOME CODEX_API_KEY CODEX_CHATGPT_AUTH_JSON)
          for name in "${forbidden[@]}"; do
            [[ -z "${!name:-}" ]] || {
              echo "::error::Provider credential environment is forbidden in a Kiingo Buzz desktop build: ${name}"
              exit 1
            }
          done
          [[ -z "${BUZZ_BUILD_AGENT_ENV:-}" ]]

      - name: Build sidecars
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --target "${TARGET}" -p buzz-acp -p buzz-agent -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          ./scripts/bundle-sidecars.sh "${TARGET}"

      - name: Build and sign Windows package
        shell: bash
        run: |
          set -euo pipefail
          export BUZZ_WINDOWS_SIGN_COMMAND="artifact-signing-cli -e ${ARTIFACT_SIGNING_ENDPOINT} -a ${ARTIFACT_SIGNING_ACCOUNT} -c ${ARTIFACT_SIGNING_PROFILE} -d Kiingo-Buzz %1"
          cd desktop
          pnpm tauri build --verbose --target "${TARGET}" --bundles nsis --config src-tauri/tauri.release.conf.json

      - name: Verify Authenticode, timestamp, and embedded Kiingo contract
        shell: pwsh
        run: |
          $bundle = "desktop/src-tauri/target/$env:TARGET/release/bundle"
          $installer = Get-ChildItem -Path "$bundle/nsis" -Filter '*.exe' | Select-Object -First 1
          $app = Get-Item "desktop/src-tauri/target/$env:TARGET/release/buzz-desktop.exe"
          if (-not $installer) { throw 'Signed NSIS installer was not produced.' }
          foreach ($file in @($app, $installer)) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne 'Valid') { throw "Invalid Authenticode signature: $($file.FullName) ($($signature.Status))" }
            if (-not $signature.SignerCertificate -or -not $signature.TimeStamperCertificate) { throw "Missing signer or RFC3161 timestamp: $($file.FullName)" }
          }
          rg -a -q 'wss://chat\.kiingo\.com' $app.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Kiingo relay URL is absent from the desktop executable.' }
          rg -a -q 'https://app\.kiingo\.com/team/harness-connections\?provider=codex&buzz=connect' $app.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Codex enrollment URL is absent from the desktop executable.' }

      - name: Stage signed release evidence
        shell: bash
        run: |
          set -euo pipefail
          bundle="desktop/src-tauri/target/${TARGET}/release/bundle"
          installer="$(find "${bundle}/nsis" -name '*.exe' -type f | head -1)"
          [[ -n "${installer}" && -f "${installer}.sig" ]]
          mkdir -p staging
          platform='windows-x86_64'
          installer_name="Kiingo-Buzz_${VERSION}_${platform}-setup.exe"
          cp "${installer}" "staging/${installer_name}"
          cp "${installer}" "staging/${installer_name}.updater"
          cp "${installer}.sig" "staging/${platform}.sig"
          jq -n \
            --arg platform "${platform}" \
            --arg installer "${installer_name}" \
            --arg archive "${installer_name}.updater" \
            '{platform:$platform,installer:$installer,archive:$archive,signature_file:($platform + ".sig")}' \
            > staging/metadata.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kiingo-desktop-windows-x86_64
          path: staging
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish immutable packages and updater manifest
    needs: [validate, macos, windows]
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      SOURCE_REVISION: ${{ needs.validate.outputs.source_revision }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.validate.outputs.source_revision }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: kiingo-desktop-*
          path: dist

      - name: Verify complete signed platform set
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t metadata < <(find dist -name metadata.json -type f | sort)
          [[ "${#metadata[@]}" -eq 3 ]] || {
            echo "::error::Expected three signed platform packages; found ${#metadata[@]}."
            exit 1
          }
          for file in "${metadata[@]}"; do
            dir="$(dirname "${file}")"
            installer="$(jq -r .installer "${file}")"
            archive="$(jq -r .archive "${file}")"
            sig="$(jq -r .signature_file "${file}")"
            [[ -s "${dir}/${installer}" && -s "${dir}/${archive}" && -s "${dir}/${sig}" ]]
          done

      - name: Create immutable and rolling releases
        shell: bash
        run: |
          set -euo pipefail
          gh release create "kiingo-desktop-v${VERSION}" \
            --target "${SOURCE_REVISION}" \
            --title "Kiingo Buzz Desktop ${VERSION}" \
            --notes "Signed Kiingo-internal Buzz desktop release pinned to chat.kiingo.com. Source: ${SOURCE_REVISION}."
          if ! gh release view kiingo-desktop-latest >/dev/null 2>&1; then
            gh release create kiingo-desktop-latest \
              --target "${SOURCE_REVISION}" \
              --title 'Kiingo Buzz Desktop updater channel' \
              --notes 'Rolling signed updater assets for Kiingo Buzz desktop clients.' \
              --prerelease
          fi

      - name: Upload packages and assemble minimum-version update manifest
        shell: bash
        run: |
          set -euo pipefail
          triples=()
          while IFS= read -r metadata; do
            dir="$(dirname "${metadata}")"
            platform="$(jq -r .platform "${metadata}")"
            installer="$(jq -r .installer "${metadata}")"
            archive="$(jq -r .archive "${metadata}")"
            signature="$(jq -r .signature_file "${metadata}")"
            gh release upload "kiingo-desktop-v${VERSION}" "${dir}/${installer}"
            gh release upload kiingo-desktop-latest "${dir}/${archive}" "${dir}/${signature}" --clobber
            url="https://github.com/Kiingo/buzz/releases/download/kiingo-desktop-latest/${archive}"
            triples+=("${platform}:${dir}/${signature}:${url}")
          done < <(find dist -name metadata.json -type f | sort)
          bash desktop/scripts/generate-oss-latest-json.sh "${VERSION}" "${triples[@]}" > latest.json
          jq -e --arg version "${VERSION}" '.version == $version and (.platforms | length) == 3' latest.json >/dev/null
          gh release upload kiingo-desktop-latest latest.json --clobber

      - name: Publish release evidence summary
        shell: bash
        run: |
          {
            echo '### Kiingo Buzz desktop release'
            echo
            echo "- Version: ${VERSION}"
            echo "- Source: ${SOURCE_REVISION}"
            echo '- Relay: `wss://chat.kiingo.com`'
            echo '- Platforms: signed/notarized macOS arm64 + x64; signed/timestamped Windows x64'
            echo '- Provider credentials: prohibited by the release environment gate'
            echo '- Update policy: signed Tauri updater manifest on `kiingo-desktop-latest`'
          } >> "${GITHUB_STEP_SUMMARY}"
